name: 🐛 Bug Report (English)
description: Crashes, errors, or unexpected behavior
title: "[Bug] Short description"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please search existing issues first** to avoid duplicates.
        Fields marked * are required. Screenshots can be dropped into the input box.

  - type: dropdown
    id: version
    attributes:
      label: Version *
      description: |
        Pick the EXACT version — do not write "latest".
        - Desktop: Settings → About shows e.g. v0.3.0
        - Web: version is shown in the footer/about area
        - From source (main): attach the commit (git log -1 --format=%h)
      options:
        - v0.3.0 (latest Release)
        - v0.2.0
        - v0.1.9
        - v0.1.8
        - v0.1.7
        - v0.1.6
        - Older
        - main source (attach commit hash)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform *
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
        - Web (browser)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area *
      options:
        - Timeline editing
        - AI Agent chat editing
        - Export (MP4 / audio / FCPXML / SRT)
        - App update / installer (desktop)
        - Transcription
        - Captions
        - Media import / media pool
        - AI generation (image/video/voice/music/SFX)
        - Preview / playback
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug *
      placeholder: |
        e.g. After AI color grading, the exported video stutters/freezes during playback.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce *
      placeholder: |
        1. Import "sample.mp4"
        2. Ask the Agent to apply color grading
        3. Export MP4 (1080p)
        4. Playback stutters around second 15
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior *
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior *
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Media info
      description: Format, resolution, frame rate, codec of the media involved (VFR? HEIC?)
      placeholder: |
        MP4, 3840x2160, 29.97fps (30000/1001), H.264
        (Pasting the output of `ffprobe <file>` here is ideal)

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs / error messages
      placeholder: |
        Drop screenshots here. Web: copy the console error from DevTools (F12).
        Desktop: paste the terminal startup log.
