# Verification CI: lint, tests, the agent-skill contract, and the production
# build. Runs on pull requests and when a v* tag is pushed (release time, where
# it also validates the tag against package.json). Ordinary branch pushes stay
# quiet — use workflow_dispatch for those. Desktop installers + GitHub Release
# publishing stay in desktop.yml (manual).
#
# Pull requests were NOT covered until 2026-08-31, and it showed: PR #123 sat
# open failing `npm run build` (`tsc -b` catches what `tsc --noEmit` does not)
# with nothing to tell its author. A PR that cannot build must say so on the PR.
name: ci

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; a release tag run is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Pinned: Node 24.20.0 deterministically breaks
          # src/gl/clipFxExport.verify.mjs on Linux (the real-render comparison
          # sees a frozen frame region). Same code and runner pass on 24.19.0.
          # The packaged app runs Electron's own Node, so users are unaffected;
          # revisit the pin on the next Node 24 patch release.
          node-version: 24.19.0
          cache: npm
      - run: npm ci --loglevel=error
        env:
          # onnxruntime-node@1.22.0's postinstall downloads extra platform binaries
          # from NuGet, which misses the win-x64 CUDA .so on ubuntu CI runners and
          # fails. CI only validates logic and doesn't load the desktop-native ORT
          # runtime, so skip that download.
          ONNXRUNTIME_NODE_INSTALL: 'skip'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run verify:agent-skill
      - run: npm run build
